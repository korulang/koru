<!--
  koru's MARK — the authoritative vector of the identity.

  DELIBERATE DUPLICATE. Copied verbatim from the site repo that first carried it:
      korulang_org/static/KoruLogo.svg   (authored in Affinity Photo: KoruLogo.afphoto)

  It lives here, in koru's own tree, because a repo's face is LOCAL: `git clone koru`
  must bring the whole identity with it, with no reach into a sibling checkout that
  may not exist. The cost of that is this copy — if the site's logo is redrawn, this
  file is updated on purpose, not by a build step. That is the trade the convention
  chooses (see ./README.md).

  `fill: currentColor` on the root is load-bearing: it is what lets a consumer render
  the mark in koru's declared accent, or in white, or on a light ground, from ONE
  asset. Do not bake a colour in here.
-->
